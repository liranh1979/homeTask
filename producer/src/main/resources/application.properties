spring.application.name=producer

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=hometask-producer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hometask.producer.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.hometask.producer.dto.Message
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

kafka.topic.create=hometask-messages-create
kafka.topic.update=hometask-messages-update
kafka.topic.delete=hometask-messages-delete
kafka.topic.read=hometask-messages-read
kafka.topic.reply=hometask-messages-reply

spring.datasource.url=jdbc:postgresql://localhost:5432/homework
spring.datasource.username=homework
spring.datasource.password=homework
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.retry.max-attempts=3
app.retry.delay-ms=1000
