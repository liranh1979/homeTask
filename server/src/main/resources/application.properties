spring.application.name=server
server.port=3000
server.servlet.context-path=/hometask/api/v1

spring.threads.virtual.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=hometask-server-reply
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hometask.server.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.hometask.server.dto.MessageResult
spring.kafka.consumer.properties.spring.json.use.type.headers=false

kafka.topic.create=hometask-messages-create
kafka.topic.update=hometask-messages-update
kafka.topic.delete=hometask-messages-delete
kafka.topic.read=hometask-messages-read
kafka.topic.reply=hometask-messages-reply

kafka.reply.timeout-seconds=5

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.cache.ttl-minutes=5
